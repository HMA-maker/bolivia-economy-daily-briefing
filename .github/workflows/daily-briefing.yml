name: Resumen Ejecutivo Diario Macroeconomía Bolivia

on:
  schedule:
    # 11:00 UTC corresponde a las 07:00 a. m. hora de Bolivia (UTC-4)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecutar manualmente en cualquier momento desde la web de GitHub

permissions:
  contents: write

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar resumen financiero, infografía y landing web
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://informe.consultoramaldonado.com' }}
        run: |
          python main.py

      - name: Guardar y Publicar Landing Page en GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en docs/"
          else
            git commit -m "Auto-publicación: Reporte Diario y Landing Page $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
